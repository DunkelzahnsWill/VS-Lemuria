name: Build and smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit on main gets its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, the base branch, so the scope step can compare them.
          fetch-depth: 2

      # A pull request that changes only record/ passes without the heavy steps (the Commandments' setup list;
      # G43). Every other pull request, every push to main and every manual run builds and tests in full.
      - name: Decide whether the heavy steps run
        id: scope
        run: |
          heavy=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
            echo "Changed files:"; echo "$changed"
            if [ -n "$changed" ] && ! echo "$changed" | grep -qv '^record/'; then
              heavy=false
              echo "Only record/ changed: the heavy steps are skipped."
            fi
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        if: steps.scope.outputs.heavy == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Cache the game server download
        if: steps.scope.outputs.heavy == 'true'
        uses: actions/cache@v6
        with:
          path: .cache/vintagestory/downloads
          key: vs-server-${{ hashFiles('scripts/versions.env') }}

      - name: Set up the game server (checksum-verified)
        if: steps.scope.outputs.heavy == 'true'
        run: scripts/setup.sh

      - name: Validate, build and package
        if: steps.scope.outputs.heavy == 'true'
        run: ./build.sh

      - name: Smoke test on a headless server
        if: steps.scope.outputs.heavy == 'true'
        run: scripts/smoke-test.sh

      # Uploaded unwrapped, so the download is lemuria_<version>.zip itself, ready for the Mods folder.
      # Kept even when the smoke test fails, so a failing build can be looked at on a PC.
      - name: Upload the mod zip
        if: ${{ !cancelled() && steps.scope.outputs.heavy == 'true' && hashFiles('Releases/*.zip') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: Releases/*.zip
          archive: false
          overwrite: true

      - name: Upload the smoke-test server logs
        if: ${{ always() && steps.scope.outputs.heavy == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-logs
          path: |
            .cache/smoke/stdout.log
            .cache/smoke/stdout-restart.log
            .cache/smoke/data/Logs/
            .cache/smoke/data/Logs-restart/
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
